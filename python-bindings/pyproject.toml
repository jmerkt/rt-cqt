[project]
name = "rt-cqt-python-tests"
version = "0.1.0"
description = "Isolated test and plotting environment for the rt-cqt Python bindings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
required-version = "==0.11.32"

[tool.pytest.ini_options]
testpaths = ["tests"]
